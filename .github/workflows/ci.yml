name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
        working-directory: app
      - run: pytest -q
        working-directory: app

  image:
    needs: [test, integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ./app
          push: true
          tags: ghcr.io/feruz92/compose-lab-web:${{ github.sha }}

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "deploy@$DEPLOY_HOST" "$GITHUB_SHA"

  integration:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WEB_TAG: ci
      REDIS_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build image
        run: docker build -t "ghcr.io/feruz92/compose-lab-web:$WEB_TAG" ./app
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 90
      - name: Smoke test
        run: ./scripts/smoke-test.sh http://127.0.0.1:8082 "$WEB_TAG"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=50
