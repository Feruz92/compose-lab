services:
  web:
    image: ghcr.io/feruz92/compose-lab-web:${WEB_TAG:?set WEB_TAG}
    restart: unless-stopped
    environment:
      REDIS_HOST: redis-typo
      APP_VERSION: ${WEB_TAG:?set WEB_TAG}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set it in .env}
    ports:
      - "127.0.0.1:8082:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis:
    image: redis:8.8-alpine
    user: redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set it in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDISCLI_AUTH\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
